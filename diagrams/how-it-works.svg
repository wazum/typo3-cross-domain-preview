<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="688" viewBox="0 0 720 688" role="img" aria-labelledby="cdp-how-title cdp-how-desc" xmlns="http://www.w3.org/2000/svg">
<title id="cdp-how-title">How a preview on another domain gets its session</title>
<desc id="cdp-how-desc">Sequence between the browser, the backend on domain A and the frontend on domain B. View webpage calls a backend route on domain A, which creates a single-use token and redirects to the page on domain B. Domain B first refreshes once so the browser sends its own cookie, then redeems the token, keeps an existing login or starts a preview-only session, sets the cookie and refreshes to the page, which now shows the hidden page.</desc>

